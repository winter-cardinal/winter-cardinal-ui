<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=Edge,chrome=1">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>HTML Element (Extended Clipping and Custom Margins)</title>
	<style>
	html, body {
		width: 100%;
		height: 100%;
		margin: 0;
		padding: 0;
		background-color: #eeeeee;
	}
	</style>
</head>
<body>
	<script src="../../js/pixi/5.3.12/pixi.min.js"></script>
	<script src="../../js/wcardinal-ui/0.471.0/wcardinal-ui.min.js"></script>
	<script src="../../js/wcardinal-ui/0.471.0/wcardinal-ui-theme-white.min.js"></script>
	<script>
	(() => {
		"use strict";

		const application = new wcardinal.ui.DApplication();

		wcardinal.ui.loadShapeClipperEx();

		const diagram = new wcardinal.ui.DDiagram({
			parent: application.stage,
			x: 0, y: 0,
			width: "100%", height: "100%"
		});

		window.element = {
			create: (parent) => {
				const div = document.createElement("div");
				const p = document.createElement("p");
				p.innerText = "THIS IS AN HTML ELEMENT ON TOP OF A SHAPE. RED AND BLUE RECTANGLES ARE LAYERS. AND THEY ARE PLACED IN FRONT OF THE BASE LAYER WHERE THE SHAPE IS PLACED. ALSO, THIS ELEMENT IS ALLOWED TO OVERFLOW AT THE BOTTOM.";
				p.setAttribute("style", "width: 100%; height: 100%; padding: 0; margin: 0; text-align: center;");
				div.appendChild(p);
				parent.appendChild(div);

				// Custom margins in pixels.
				// Setting margins allows the `p` element to overflow the `div` element.
				// Without margins, any part overflowing the `div` element is clipped.
				// Set dataset.margin to customize all sides at once.
				// Set dataset.marginTop, dataset.marginRight, dataset.marginBottom, or dataset.marginLeft to customize individual sides.
				div.dataset.marginBottom = 100;
				return div;
			}
		};

		fetch("../../resource/diagram/html-element-clipping.json").then((response) => {
			response.json().then((json) => {
				diagram.set(json);
				diagram.view.fit();
			});
		});
	})();
	</script>
</body>
</html>
